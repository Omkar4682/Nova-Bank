<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register — Nova Banking</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
<div class="auth-container" style="padding: 30px 0;">
    <div class="auth-card" style="width:480px;">
        <div style="text-align:center;font-size:32px;margin-bottom:6px;">🏦</div>
        <div class="auth-title">Open Your Account</div>
        <div class="auth-subtitle">Fill in your details to register</div>

        {% if form.errors %}
        <div class="bank-alert-danger" style="margin-bottom:14px;">
            {% for field, errors in form.errors.items %}
                {% for error in errors %}
                    <div>⚠ {{ error }}</div>
                {% endfor %}
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input class="bank-form-control" name="username" placeholder="Username"
                   value="{{ request.POST.username|default:'' }}" required>
            <input class="bank-form-control" type="email" name="email" placeholder="Email Address"
                   value="{{ request.POST.email|default:'' }}" required>
            <input class="bank-form-control" type="password" name="password" placeholder="Password" required>
            <input class="bank-form-control" name="mobile" placeholder="Mobile Number (10 digits)"
                   value="{{ request.POST.mobile|default:'' }}" required>
            <textarea class="bank-form-control" name="address" placeholder="Full Address" rows="2">{{ request.POST.address|default:'' }}</textarea>
            <input class="bank-form-control" name="aadhaar" placeholder="Aadhaar Number (12 digits)"
                   value="{{ request.POST.aadhaar|default:'' }}" required>
            <input class="bank-form-control" name="pan" placeholder="PAN Number (e.g. ABCDE1234F)"
                   value="{{ request.POST.pan|default:'' }}" required>
            <label style="font-size:12px;color:#666;margin-bottom:4px;display:block;">Profile Photo (optional)</label>
            <input class="bank-form-control" type="file" name="photo" accept="image/*">
            <button class="btn-bank-primary" style="margin-top:10px;">Create Account</button>
        </form>

        <div class="auth-link">
            Already registered?
            <a href="{% url 'login' %}">Login here</a>
        </div>
    </div>
</div>
</body>
</html>
