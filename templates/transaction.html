{% extends 'base.html' %}

{% block content %}

<div class="page-wrapper">

    <div class="page-heading">Deposit / Withdraw</div>
    <div class="page-subheading">Perform cash transactions on a customer account</div>

    <div class="bank-card" style="max-width:480px;">

        <form method="POST">
            {% csrf_token %}

            <label style="font-size:12px;color:#555;font-weight:600;">Account Number</label>
            <input class="bank-form-control" name="accno" placeholder="12-digit account number" maxlength="12" required>

            <label style="font-size:12px;color:#555;font-weight:600;">Transaction Type</label>
            <select class="bank-form-control" name="ttype" required>
                <option value="">— Select —</option>
                <option value="DEPOSIT">Deposit</option>
                <option value="WITHDRAW">Withdraw</option>
            </select>

            <label style="font-size:12px;color:#555;font-weight:600;">Amount (₹)</label>
            <input class="bank-form-control" type="number" name="amount" placeholder="Enter amount" min="1" step="0.01" required>

            <button class="btn-bank-primary" style="margin-top:5px;">Submit Transaction</button>
        </form>

        {% if success %}
        <div class="bank-alert-info" style="margin-top:15px;">✅ {{ success }}</div>
        {% endif %}

        {% if error %}
        <div class="bank-alert-danger" style="margin-top:15px;">⚠ {{ error }}</div>
        {% endif %}

    </div>

</div>

{% endblock %}
